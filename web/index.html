<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Root-based assets remain valid on /etudes/:id and /practice/:id, including Capacitor bundles. -->
<base href="/">
<title>Goosh</title>
<link rel="stylesheet" href="style.css?v=mobile-signature-modal-1">
<link rel="stylesheet" href="home.css?v=goosh-glass-theme-1">
<link rel="stylesheet" href="etudes.css?v=goosh-glass-theme-1">
<link rel="stylesheet" href="practice-designer.css?v=mobile-signature-modal-1">
<header><img class="wordmark light-logo" src="brand/goosh-wordmark-light.png" alt="Goosh" width="100" height="40">
  <img class="wordmark dark-logo" src="brand/goosh-wordmark-dark.png" alt="Goosh" width="100" height="40">
  <nav id="nav"></nav>
  <aside><button id="lang"></button><button id="theme">◐</button></aside>
</header>
<!-- Etudes design-only controls. Existing app logic remains untouched. -->
<section id="etudes-design-controls" aria-label="Etudes library controls">
  <div class="etudes-design-intro">
    <div class="etudes-design-intro-text">
      <h1><span lang="en">Etudes</span><span lang="fa">اتودها</span></h1>
    </div>
    <div class="etudes-design-art" aria-hidden="true"><span>𝄞</span><span>♫</span><span>♩</span></div>
  </div>
  <div class="etudes-design-toolbar">
    <label class="etudes-design-search">
      <span aria-hidden="true">⌕</span>
      <input lang="fa" type="search" placeholder="جستجو در اتودها" disabled aria-label="جستجو در اتودها" />
      <input lang="en" type="search" placeholder="Search etudes" disabled aria-label="Search etudes" />
    </label>
    <div class="etudes-design-tabs" role="group" aria-label="Etude collection filter">
      <input type="radio" name="etudes-display-filter" id="etudes-all" checked />
      <label for="etudes-all"><span lang="en">All</span><span lang="fa">همه اتودها</span></label>
      <input type="radio" name="etudes-display-filter" id="etudes-mine" />
      <label for="etudes-mine"><span lang="en">My etudes</span><span lang="fa">اتودهای من</span></label>
      <input type="radio" name="etudes-display-filter" id="etudes-imported" />
      <label for="etudes-imported"><span lang="en">Imported</span><span lang="fa">واردشده</span></label>
    </div>
  </div>
  <div class="etudes-design-status" aria-label="Personal etude status design placeholders">
    <button type="button" disabled><span lang="fa">پیش‌نویس‌ها</span><span lang="en">Drafts</span></button>
    <button type="button" disabled><span lang="fa">منتشرشده‌ها</span><span lang="en">Published</span></button>
  </div>
</section>
<!-- Practice list design only; original list and practice handlers are unchanged. -->
<section id="practice-design-controls" aria-label="Practice etudes">
  <div class="practice-design-intro">
    <h1><span lang="en">Practice</span><span lang="fa">تمرین‌ها</span></h1>
    <div class="practice-design-art" aria-hidden="true"><span>𝄞</span><span>♫</span><span>♪</span></div>
  </div>
  <div class="practice-design-toolbar">
    <label class="practice-design-search">
      <span aria-hidden="true">⌕</span>
      <input lang="fa" type="search" placeholder="جستجو در اتودهای تمرینی" disabled aria-label="جستجو در تمرین‌ها" />
      <input lang="en" type="search" placeholder="Search practice etudes" disabled aria-label="Search practice etudes" />
    </label>
    <div class="practice-design-tabs" role="group" aria-label="Practice list filters">
      <input type="radio" name="practice-display-filter" id="practice-all" checked />
      <label for="practice-all"><span lang="en">All</span><span lang="fa">همه اتودها</span></label>
      <input type="radio" name="practice-display-filter" id="practice-mine" />
      <label for="practice-mine"><span lang="en">My etudes</span><span lang="fa">اتودهای من</span></label>
      <input type="radio" name="practice-display-filter" id="practice-imported" />
      <label for="practice-imported"><span lang="en">Imported</span><span lang="fa">واردشده</span></label>
    </div>
  </div>
</section>
<main id="app"></main><input hidden type="file" id="file" accept=".goosh,.json"><footer id="footer"></footer>
<script type="module">
  import('./src/app.js?v=mobile-signature-modal-1').catch(error => {
    console.error(error);
    const app = document.querySelector('#app');
    const message = document.createElement('p');
    message.textContent = location.protocol === 'file:'
      ? 'برای اجرای Goosh، صفحه را از آدرس سرور محلی باز کنید.'
      : 'بارگذاری Goosh کامل نشد. صفحه را دوباره بارگذاری کنید.';
    const detail = document.createElement('pre');
    detail.dir = 'ltr';
    detail.style.whiteSpace = 'pre-wrap';
    detail.textContent = error.message;
    app.replaceChildren(message, detail);
  });
</script>

</html>
