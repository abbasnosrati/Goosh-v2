<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goosh</title>
<link rel="stylesheet" href="style.css?v=etude-list-1">
<link rel="stylesheet" href="home.css?v=redesign-10">
<link rel="stylesheet" href="etudes.css?v=design-1">
<header><img class="wordmark light-logo" src="brand/goosh-wordmark-light.png" alt="Goosh" width="100" height="40">
  <img class="wordmark dark-logo" src="brand/goosh-wordmark-dark.png" alt="Goosh" width="100" height="40">
  <nav id="nav"></nav>
  <aside><button id="lang"></button><button id="theme">◐</button></aside>
</header>
<!-- Etudes design-only controls. Existing app logic remains untouched. -->
<section id="etudes-design-controls" aria-label="Etudes library controls">
  <div class="etudes-design-intro">
    <div class="etudes-design-intro-text">
      <span class="etudes-design-eyebrow" lang="en">YOUR MUSIC LIBRARY</span>
      <span class="etudes-design-eyebrow" lang="fa">کتابخانه موسیقی تو</span>
      <h1><span lang="en">Etudes</span><span lang="fa">اتودها</span></h1>
      <p><span lang="en">Your music, all in one place.</span><span lang="fa">اتودهایت، همه در یک فضای منظم.</span></p>
    </div>
    <div class="etudes-design-art" aria-hidden="true"><span>𝄞</span><span>♫</span><span>♩</span></div>
  </div>
  <div class="etudes-design-toolbar">
    <label class="etudes-design-search">
      <span aria-hidden="true">⌕</span>
      <input lang="fa" type="search" placeholder="جستجو در اتودها" disabled aria-label="جستجو در اتودها" />
      <input lang="en" type="search" placeholder="Search etudes" disabled aria-label="Search etudes" />
    </label>
    <div class="etudes-design-tabs" role="group" aria-label="Etude collection filter">
      <input type="radio" name="etudes-display-filter" id="etudes-all" checked />
      <label for="etudes-all"><span lang="en">All</span><span lang="fa">همه اتودها</span></label>
      <input type="radio" name="etudes-display-filter" id="etudes-mine" />
      <label for="etudes-mine"><span lang="en">My etudes</span><span lang="fa">اتودهای من</span></label>
      <input type="radio" name="etudes-display-filter" id="etudes-imported" />
      <label for="etudes-imported"><span lang="en">Imported</span><span lang="fa">واردشده</span></label>
    </div>
    <label class="etudes-design-sort"><span lang="en">Sort</span><span lang="fa">مرتب‌سازی</span>
      <select lang="fa" disabled aria-label="مرتب‌سازی اتودها"><option>جدیدترین‌ها</option><option>محبوب‌ترین‌ها</option><option>نام اتود</option></select>
      <select lang="en" disabled aria-label="Sort etudes"><option>Newest</option><option>Popular</option><option>Title</option></select>
    </label>
    <button class="etudes-design-preview-trigger" type="button" popovertarget="etudes-design-quickview">
      <span lang="fa">نمونه پیش‌نمایش</span><span lang="en">Quick view sample</span>
    </button>
  </div>
  <div class="etudes-design-categories" aria-label="Etude category design placeholders">
    <span lang="fa">دسته‌بندی</span><span lang="en">Categories</span>
    <button type="button" disabled><span lang="fa">آهنگسازی</span><span lang="en">Composition</span></button>
    <button type="button" disabled><span lang="fa">تمرین شنوایی</span><span lang="en">Ear training</span></button>
    <button type="button" disabled><span lang="fa">ریتم</span><span lang="en">Rhythm</span></button>
    <button type="button" disabled><span lang="fa">موسیقی ایرانی</span><span lang="en">Iranian music</span></button>
  </div>
  <div class="etudes-design-status" aria-label="Personal etude status design placeholders">
    <button type="button" disabled><span lang="fa">پیش‌نویس‌ها</span><span lang="en">Drafts</span></button>
    <button type="button" disabled><span lang="fa">منتشرشده‌ها</span><span lang="en">Published</span></button>
  </div>
</section>
<div id="etudes-design-quickview" popover aria-label="Etude quick view design preview">
  <div class="etudes-quickview-heading">
    <div><span class="etudes-design-eyebrow" lang="fa">پیش‌نمایش اتود</span><span class="etudes-design-eyebrow" lang="en">QUICK VIEW</span>
    <h2><span lang="fa">عنوان اتود</span><span lang="en">Etude title</span></h2></div>
    <button type="button" popovertarget="etudes-design-quickview" popovertargetaction="hide" aria-label="Close">×</button>
  </div>
  <div class="etudes-quickview-score" aria-hidden="true"><span>𝄞</span><span>♪</span><span>♬</span><span>♩</span></div>
  <div class="etudes-quickview-facts">
    <div><small lang="fa">هنرمند</small><small lang="en">Artist</small><strong>—</strong></div>
    <div><small lang="fa">تحسین‌ها</small><small lang="en">Appreciations</small><strong>—</strong></div>
    <div><small lang="fa">مدت اتود</small><small lang="en">Duration</small><strong>—</strong></div>
    <div><small lang="fa">وضعیت</small><small lang="en">Status</small><strong>—</strong></div>
  </div>
  <div class="etudes-quickview-footer"><button disabled type="button"><span lang="fa">باز کردن اتود</span><span lang="en">Open etude</span></button></div>
</div>
<main id="app"></main><input hidden type="file" id="file" accept=".goosh,.json"><footer id="footer"></footer>
<script type="module">
  import('./src/app.js?v=redesign-3').catch(error => {
    console.error(error);
    const app = document.querySelector('#app');
    const message = document.createElement('p');
    message.textContent = location.protocol === 'file:'
      ? 'برای اجرای Goosh، صفحه را از آدرس سرور محلی باز کنید.'
      : 'بارگذاری Goosh کامل نشد. صفحه را دوباره بارگذاری کنید.';
    const detail = document.createElement('pre');
    detail.dir = 'ltr';
    detail.style.whiteSpace = 'pre-wrap';
    detail.textContent = error.message;
    app.replaceChildren(message, detail);
  });
</script>

</html>
